<body style="margin:0; background:#f5f7fa;">

  .car-name{

  const REASON_COLORS = {
    '출장': { bg:'rgba(37,99,235,0.12)', fg:'#1d4ed8' },
    '휴가': { bg:'rgba(22,163,74,0.13)', fg:'#15803d' },
    '자차': { bg:'rgba(147,51,234,0.12)', fg:'#7e22ce' },
    '기타': { bg:'rgba(107,115,130,0.14)', fg:'#4b5563' }
  };
  const REASON_ICONS = {
    '출장': '✈️',
    '휴가': '🏖️',
    '자차': '🚗',
    '기타': '📌'
  };
  function reasonStyle(reason){
    const c = REASON_COLORS[reason] || REASON_COLORS['기타'];
    return `background:${c.bg}; color:${c.fg};`;
  }
  function reasonIcon(reason){
    return REASON_ICONS[reason] || REASON_ICONS['기타'];
  }

  function makeIconDataUrl(){
    try{
      const canvas = document.createElement('canvas');
      canvas.width = 192; canvas.height = 192;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#c2740a';
      ctx.fillRect(0,0,192,192);
      ctx.font = '120px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🚌', 96, 104);
      return canvas.toDataURL('image/png');
    } catch(e){ return null; }
  }

  function setupHomeScreenHints(){
    try{
      document.title = '퇴근 셔틀 배차현황';
      const head = document.head;

      function upsertMeta(name, content){
        let el = head.querySelector(`meta[name="${name}"]`);
        if(!el){ el = document.createElement('meta'); el.setAttribute('name', name); head.appendChild(el); }
        el.setAttribute('content', content);
      }
      upsertMeta('apple-mobile-web-app-capable', 'yes');
      upsertMeta('apple-mobile-web-app-title', '퇴근셔틀');
      upsertMeta('apple-mobile-web-app-status-bar-style', 'black-translucent');
      upsertMeta('theme-color', '#c2740a');
      upsertMeta('viewport', 'width=device-width, initial-scale=1, maximum-scale=1');

      const iconUrl = makeIconDataUrl();
      if(iconUrl){
        ['apple-touch-icon', 'icon'].forEach(rel => {
          let link = head.querySelector(`link[rel="${rel}"]`);
          if(!link){ link = document.createElement('link'); link.setAttribute('rel', rel); head.appendChild(link); }
          link.setAttribute('href', iconUrl);
        });

        const manifest = {
          name: '퇴근 셔틀 배차현황',
          short_name: '퇴근셔틀',
          start_url: location.href,
          display: 'standalone',
          background_color: '#f5f7fa',
          theme_color: '#c2740a',
          icons: [{ src: iconUrl, sizes: '192x192', type: 'image/png' }]
        };
        const manifestUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' }));
        let manifestLink = head.querySelector('link[rel="manifest"]');
        if(!manifestLink){ manifestLink = document.createElement('link'); manifestLink.setAttribute('rel','manifest'); head.appendChild(manifestLink); }
        manifestLink.setAttribute('href', manifestUrl);
      }
    } catch(e){ console.error('홈 화면 아이콘 설정 실패', e); }
  }

  function todayStr(){
    return new Date().toLocaleDateString('sv-SE');
  }

  function isPastCutoff(){
    const now = new Date();
    const [h,m] = CUTOFF_TIME.split(':').map(Number);
    return (now.getHours()*60 + now.getMinutes()) >= (h*60+m);
  }

  function mondayOf(d){
    const date = new Date(d);
    const day = date.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }

  function weeksSinceAnchor(){
    const thisMonday = mondayOf(new Date());
    const diffDays = Math.round((thisMonday - ANCHOR_MONDAY) / (24*3600*1000));
    const weeks = Math.floor(diffDays / 7);
    return ((weeks % 4) + 4) % 4;
  }

  function driverForSlot(slotIdx){
    const w = weeksSinceAnchor();
    const baseIdx = ((slotIdx - w) % 4 + 4) % 4;
    return DRIVERS_BASE[baseIdx];
  }

  function defaultCars(){
    return SLOTS.map(s => ({ id:s.idx, passengers:[], memos:[] }));
  }
  function defaultData(){
    return { date: todayStr(), cars: defaultCars() };
  }

  const db = firebase.firestore();

  // 사내망/VPN 등에서 웹소켓이 막혀 있으면 최초 연결이 느려질 수 있어,
  // 연결 방식을 자동으로 빠르게 감지하도록 설정합니다.
  try{ db.settings({ experimentalAutoDetectLongPolling: true }); } catch(e){ console.warn('firestore settings 적용 실패', e); }

  // 마지막으로 불러온 데이터를 기기에 캐싱해서, 다음 접속부터는 "불러오는 중" 없이
  // 캐시된 화면이 즉시 뜨고 백그라운드에서 최신 데이터로 갱신되도록 합니다.
  // (여러 탭을 동시에 켜두면 캐시가 적용되지 않을 수 있지만, 평소 한 탭으로 쓰는
  //  일반적인 사용 환경에서는 문제 없이 즉시 로딩됩니다)
  try{
    db.enablePersistence().catch((err) => {
      console.warn('오프라인 캐시 사용 불가:', err && err.code);
    });
  } catch(e){ console.warn('enablePersistence 호출 실패', e); }

  const boardDocRef = db.collection('shuttle').doc('board');
  const leavesDocRef = db.collection('shuttle').doc('leaves');

  async function saveBoard(){
    try{ await boardDocRef.set(data); }
    catch(e){ console.error('저장 실패', e); }
  }
  async function saveLeaves(){
    try{ await leavesDocRef.set({ leaves }); }
    catch(e){ console.error('저장 실패', e); }
  }

  function todaysNonUsers(){
    const t = todayStr();
    return leaves.filter(l => l.start <= t && t <= l.end);
  }

  function shouldPauseRefresh(){
    if(pendingConfirm) return true;
    if(document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('car-memo')) return true;
    if(document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.id && (document.activeElement.id.startsWith('name-') || document.activeElement.id === 'nonuserName')) return true;
    return false;
  }

  let boardReady = false, leavesReady = false, pendingRerender = false;
  function tryRender(){
    if(!boardReady || !leavesReady) return;
    if(shouldPauseRefresh()){ pendingRerender = true; return; }
    pendingRerender = false;
    render();
  }
  document.addEventListener('focusout', () => {
    setTimeout(() => { if(pendingRerender) tryRender(); }, 250);
  }, true);

  function subscribeRealtime(){
    boardDocRef.onSnapshot((snap) => {
      if(snap.exists){
        const parsed = snap.data();
        if(parsed.date !== todayStr()){
          data = defaultData();
          saveBoard();
        } else {
          data = parsed;
          data.cars.forEach(c => {
            if(!Array.isArray(c.memos)){
              c.memos = (typeof c.memo === 'string' && c.memo.trim()) ? [{ id:'legacy-'+c.id, text:c.memo.trim() }] : [];
            }
            delete c.memo;
          });
        }
      } else {
        data = defaultData();
        saveBoard();
      }
      boardReady = true;
      tryRender();
    }, (err) => console.error('보드 구독 오류', err));

    leavesDocRef.onSnapshot((snap) => {
      leaves = (snap.exists && Array.isArray(snap.data().leaves)) ? snap.data().leaves : [];
      leavesReady = true;
      tryRender();
    }, (err) => console.error('미이용 구독 오류', err));
  }

  function totalBooked(){ return data.cars.reduce((s,c)=>s+c.passengers.length,0); }
  function totalEntered(){ return totalBooked() + todaysNonUsers().length; }

  function assignedNamesToday(){
    const set = new Set();
    data.cars.forEach(c => c.passengers.forEach(p => set.add(p.name)));
    todaysNonUsers().forEach(n => set.add(n.name));
    return set;
  }

  function seatDots(car){
    let html = '';
    for(let i=0;i<CAPACITY;i++){
      if(i < car.passengers.length){
        html += `<div class="seat ${car.passengers.length>=CAPACITY?'full':'filled'}"></div>`;
      } else {
        html += `<div class="seat"></div>`;
      }
    }
    return html;
  }

  function fmtRange(l){
    if(l.start === l.end) return '';
    const s = l.start.slice(5).replace('-','/');
    const e = l.end.slice(5).replace('-','/');
    return `${s}~${e}`;
  }

  // 'YYYY-MM-DD' -> '7월 28일' (연도 생략)
  function fmtDateShort(d){
    if(!d) return '';
    const parts = d.split('-');
    if(parts.length < 3) return d;
    const m = parseInt(parts[1], 10);
    const day = parseInt(parts[2], 10);
    if(!m || !day) return d;
    return `${m}월 ${day}일`;
  }
  function dateLabelText(d){
    return `📅 ${fmtDateShort(d)}`;
  }
  // 클릭/탭한 곳이 어디든 날짜 입력창의 네이티브 달력이 뜨도록 강제로 열어줍니다
  function openDatePicker(input){
    if(!input) return;
    try{
      if(typeof input.showPicker === 'function'){ input.showPicker(); }
      else { input.focus(); }
    } catch(e){ input.focus(); }
  }

  // 재렌더링으로 입력 중이던 값이 사라지지 않도록 상태를 저장/복원
  function captureFormState(){
    const st = {};
    data.cars.forEach(car => {
      const nameSel = document.getElementById('name-'+car.id);
      const memoInp = document.getElementById('memo-'+car.id);
      st['name-'+car.id] = nameSel ? nameSel.value : '';
      st['memo-'+car.id] = memoInp ? memoInp.value : '';
    });
    const nuName = document.getElementById('nonuserName');
    const nuReason = document.getElementById('nonuserReason');
    const nuStart = document.getElementById('nonuserStart');
    const nuEnd = document.getElementById('nonuserEnd');
    st.nuName = nuName ? nuName.value : '';
    st.nuReason = nuReason ? nuReason.value : '';
    st.nuStart = nuStart ? nuStart.value : '';
    st.nuEnd = nuEnd ? nuEnd.value : '';
    return st;
  }
  function restoreFormState(st){
    if(!st) return;
    data.cars.forEach(car => {
      const nameSel = document.getElementById('name-'+car.id);
      const memoInp = document.getElementById('memo-'+car.id);
      if(nameSel && st['name-'+car.id]) nameSel.value = st['name-'+car.id];
      if(memoInp && st['memo-'+car.id] !== undefined && document.activeElement !== memoInp) memoInp.value = st['memo-'+car.id];
    });
    const nuName = document.getElementById('nonuserName');
    const nuReason = document.getElementById('nonuserReason');
    const nuStart = document.getElementById('nonuserStart');
    const nuEnd = document.getElementById('nonuserEnd');
    if(nuName && st.nuName) nuName.value = st.nuName;
    if(nuReason && st.nuReason) nuReason.value = st.nuReason;
    if(nuStart && st.nuStart){
      nuStart.value = st.nuStart;
      const lbl = document.getElementById('nonuserStartLabel');
      if(lbl) lbl.textContent = dateLabelText(nuStart.value);
    }
    if(nuEnd && st.nuEnd){
      nuEnd.value = st.nuEnd;
      const lbl = document.getElementById('nonuserEndLabel');
      if(lbl) lbl.textContent = dateLabelText(nuEnd.value);
    }
  }

  function render(){
    const formState = captureFormState();

    const dateLabel = new Date(data.date+'T00:00:00').toLocaleDateString('ko-KR', { month:'long', day:'numeric', weekday:'short' });
    const entered = totalEntered();
    const pct = Math.min(100, Math.round((entered / TOTAL_STAFF) * 100));
    const todayNU = todaysNonUsers();
    const assigned = assignedNamesToday();
    const availableRoster = ROSTER.filter(n => !assigned.has(n));

    root.innerHTML = `
      <div class="system-title-bar">
        <div class="system-title">주재원 퇴근 차량 게시판</div>
        <div class="notice">
          <span class="notice-label">⏰ 오늘 퇴근 차량 입력 마감</span>
          <span class="notice-time">${CUTOFF_TIME}</span>
        </div>
      </div>

      ${isPastCutoff() ? renderResultBoard() : ''}

      <div class="head">
        <div>
          <h1>퇴근 차량 입력 현황</h1>
          <div class="sub">${dateLabel}</div>
        </div>
        <div style="display:flex; align-items:flex-end;">
          <div class="stat">
            ${pct >= 100 ? `
              <div class="complete-badge">✅ 전원 입력 완료</div>
              <div class="complete-sub">${entered} / ${TOTAL_STAFF}명</div>
            ` : `
              <div class="num">${entered} / ${TOTAL_STAFF} (${pct}%)</div>
              <div class="label">전체 입력 완료율</div>
              <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%;"></div></div>
            `}
          </div>
          <button class="reset-btn" id="statusBtn">${statusOpen ? '입력 현황 닫기' : '입력 현황 보기'}</button>
        </div>
      </div>

      ${statusOpen ? renderStatusPanel() : ''}

      <div class="section-label">미이용 등록 (출장 · 휴가 · 자차 등, 기간 지정 가능)</div>
      <div class="nonuser-card">
        <div class="nonuser-list" id="nonuserList">
          ${todayNU.length === 0
            ? '<div class="nonuser-empty">오늘 등록된 미이용자가 없습니다</div>'
            : todayNU.map(n => (pendingConfirm && pendingConfirm.type === 'leave' && pendingConfirm.id === n.id) ? `
              <div class="nonuser-chip confirming">
                <span>${escapeHtml(n.name)} 등록 취소?</span>
                <button class="chip-yes" id="nuYes-${n.id}">예</button>
                <button class="chip-no" id="nuNo-${n.id}">아니오</button>
              </div>
            ` : `
              <div class="nonuser-chip">
                <span>${escapeHtml(n.name)}</span>
                <span class="reason" style="${reasonStyle(n.reason)}">${reasonIcon(n.reason)} ${escapeHtml(n.reason)}</span>
                ${fmtRange(n) ? `<span class="range">${fmtRange(n)}</span>` : ''}
                <button id="delnu-${n.id}" title="등록 취소">×</button>
              </div>
            `).join('')}
        </div>
        <div class="nonuser-add">
          <div class="nu-row-name">
            <input type="text" id="nonuserName" placeholder="이름 입력" autocomplete="off">
            <button id="nonuserAddBtn">등록</button>
          </div>
          <div class="nu-row-meta">
            <select id="nonuserReason">
              ${NONUSE_REASONS.map(r => `<option value="${r}">${reasonIcon(r)} ${r}</option>`).join('')}
            </select>
            <span class="date-wrap">
              <span class="date-label" id="nonuserStartLabel">${dateLabelText(todayStr())}</span>
              <input type="date" id="nonuserStart" value="${todayStr()}" title="시작일 (탭하면 달력이 열립니다)">
            </span>
            <span class="date-sep">~</span>
            <span class="date-wrap">
              <span class="date-label" id="nonuserEndLabel">${dateLabelText(todayStr())}</span>
              <input type="date" id="nonuserEnd" value="${todayStr()}" title="종료일 (탭하면 달력이 열립니다)">
            </span>
          </div>
        </div>
      </div>

      <div class="section-label">차량별 탑승 명단</div>
      <div class="grid">
        ${data.cars.map(car => renderCar(car, availableRoster)).join('')}
      </div>
      <div class="foot-note">탑승 명단은 매일 자동 초기화됩니다</div>
    `;

    document.getElementById('statusBtn').onclick = () => {
      statusOpen = !statusOpen;
      render();
    };

    todayNU.forEach(n => {
      const btn = document.getElementById('delnu-'+n.id);
      if(btn){
        btn.onclick = () => {
          pendingConfirm = { type:'leave', id:n.id };
          render();
        };
      }
      const yesBtn = document.getElementById('nuYes-'+n.id);
      if(yesBtn){
        yesBtn.onclick = async () => {
          pendingConfirm = null;
          leaves = leaves.filter(x => x.id !== n.id);
          await saveLeaves();
          render();
        };
        document.getElementById('nuNo-'+n.id).onclick = () => {
          pendingConfirm = null;
          render();
        };
      }
    });

    const nuNameSel = document.getElementById('nonuserName');
    const nuReasonSelect = document.getElementById('nonuserReason');
    const nuStartInput = document.getElementById('nonuserStart');
    const nuEndInput = document.getElementById('nonuserEnd');
    if(nuStartInput){
      nuStartInput.oninput = () => {
        const lbl = document.getElementById('nonuserStartLabel');
        if(lbl) lbl.textContent = dateLabelText(nuStartInput.value);
      };
      nuStartInput.onclick = () => openDatePicker(nuStartInput);
      nuStartInput.onfocus = () => openDatePicker(nuStartInput);
    }
    if(nuEndInput){
      nuEndInput.oninput = () => {
        const lbl = document.getElementById('nonuserEndLabel');
        if(lbl) lbl.textContent = dateLabelText(nuEndInput.value);
      };
      nuEndInput.onclick = () => openDatePicker(nuEndInput);
      nuEndInput.onfocus = () => openDatePicker(nuEndInput);
    }
    document.getElementById('nonuserAddBtn').onclick = async () => {
      const name = nuNameSel.value.trim();
      if(!name) return;
      let start = nuStartInput.value || todayStr();
      let end = nuEndInput.value || start;
      if(end < start) end = start;
      leaves.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), name, reason: nuReasonSelect.value, start, end });
      nuNameSel.value = '';
      await saveLeaves();
      render();
    };

    data.cars.forEach(car => {
      car.passengers.forEach(p => {
        const delBtn = document.getElementById('del-'+car.id+'-'+p.id);
        if(delBtn){
          delBtn.onclick = async () => {
            car.passengers = car.passengers.filter(x => x.id !== p.id);
            await saveBoard();
            render();
          };
        }
      });

      const addBtn = document.getElementById('add-'+car.id);
      const nameSel = document.getElementById('name-'+car.id);

      const memoInput = document.getElementById('memo-'+car.id);
      const memoDoneBtn = document.getElementById('memodone-'+car.id);
      if(memoDoneBtn && memoInput){
        memoDoneBtn.onclick = async () => {
          const text = memoInput.value.trim();
          if(!text) return;
          if(!Array.isArray(car.memos)) car.memos = [];
          car.memos.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), text });
          memoInput.value = '';
          await saveBoard();
          render();
        };
      }
      car.memos && car.memos.forEach(m => {
        const delBtn = document.getElementById('delmemo-'+car.id+'-'+m.id);
        if(delBtn){
          delBtn.onclick = async () => {
            car.memos = car.memos.filter(x => x.id !== m.id);
            await saveBoard();
            render();
          };
        }
      });

      if(addBtn){
        addBtn.onclick = async () => {
          const name = nameSel.value.trim();
          if(!name) return;
          if(car.passengers.length >= CAPACITY) return;
          car.passengers.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), name });
          nameSel.value = '';
          await saveBoard();
          render();
        };
      }
    });

    restoreFormState(formState);
  }

  function renderCar(car, availableRoster){
    const slot = SLOTS[car.id];
    const driver = driverForSlot(slot.idx);
    const isFull = car.passengers.length >= CAPACITY;
    return `
      <div class="car">
        <div class="car-top">
          <div class="car-name">${slot.label}</div>
          <div class="car-time">${slot.time}</div>
        </div>
        <div class="car-driver">기사 <b>${driver}</b></div>
        ${car.memos && car.memos.length > 0 ? `
          <div class="car-memo-badges">
            ${car.memos.map(m => `
              <div class="car-memo-badge">
                <span>${escapeHtml(m.text)}</span>
                <button class="memo-del-btn" id="delmemo-${car.id}-${m.id}" title="삭제">×</button>
              </div>
            `).join('')}
          </div>
        ` : ''}
        <div class="seats-row">
          <div class="seats">${seatDots(car)}</div>
          <div class="status-line ${isFull ? 'full' : 'ok'}">${isFull ? '마감' : (CAPACITY - car.passengers.length) + '자리 남음'}</div>
        </div>
        <ul class="plist">
          ${car.passengers.length === 0
            ? '<li class="empty-row" style="background:none; padding:2px;">예약자가 없습니다</li>'
            : car.passengers.map((p, i) => `
              <li>
                <span class="pname"><span class="pnum">${circledNumber(i+1)}</span>${escapeHtml(p.name)}</span>
                <button id="del-${car.id}-${p.id}" title="삭제">×</button>
              </li>
            `).join('')}
        </ul>
        <div class="add-row">
          <input type="text" id="name-${car.id}" placeholder="이름 입력" autocomplete="off" ${isFull ? 'disabled' : ''}>
          <button id="add-${car.id}" ${isFull ? 'disabled' : ''}>탑승</button>
        </div>
        <div class="car-memo-label">Memo</div>
        <div class="memo-row">
          <textarea class="car-memo" id="memo-${car.id}" placeholder="예: 정비 중, 기사 변경, 경로 변경 등"></textarea>
          <button class="memo-done-btn" id="memodone-${car.id}">입력</button>
        </div>
      </div>
    `;
  }

  function circledNumber(n){
    const map = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
    return map[n-1] || `(${n})`;
  }

  function renderResultBoard(){
    const dateLabel = new Date(data.date+'T00:00:00').toLocaleDateString('ko-KR', { month:'long', day:'numeric', weekday:'short' });
    const rows = data.cars.map(car => {
      const slot = SLOTS[car.id];
      const driver = driverForSlot(slot.idx);
      const names = car.passengers.length === 0
        ? '탑승자 없음'
        : car.passengers.map(p => escapeHtml(p.name)).join(', ');
      return `
        <div class="result-row">
          <div class="result-row-top">
            <span class="result-car">${slot.label}</span>
            <span class="result-driver">기사 ${escapeHtml(driver)}</span>
            <span class="result-time">${slot.time} 출발</span>
          </div>
          <div class="result-names">${names}</div>
        </div>
      `;
    }).join('');

    return `
      <div class="result-board" id="resultBoard">
        <div class="result-board-title">🚌 Today 배차 마감현황 <span class="result-board-date">${dateLabel} · ${CUTOFF_TIME} 마감</span></div>
        ${rows}
      </div>
    `;
  }

  function renderStatusPanel(){
    const todayNU = todaysNonUsers();
    const carRows = data.cars.map(car => {
      const slot = SLOTS[car.id];
      const driver = driverForSlot(slot.idx);
      const names = car.passengers.length === 0
        ? '<span class="summary-note">탑승자 없음</span>'
        : car.passengers.map((p,i) => `${circledNumber(i+1)}${escapeHtml(p.name)}`).join('  ');
      return `
        <div class="status-panel-row">
          <div class="status-panel-slot">${slot.label} <span class="status-panel-time">${slot.time}</span><span class="status-panel-driver">기사 ${escapeHtml(driver)}</span></div>
          <div class="status-panel-names">${names}</div>
        </div>
      `;
    }).join('');

    const nuText = todayNU.length === 0
      ? '<span class="summary-note">없음</span>'
      : todayNU.map(n => `${escapeHtml(n.name)}(${reasonIcon(n.reason)}${escapeHtml(n.reason)})`).join(', ');

    const assigned = assignedNamesToday();
    const missing = ROSTER.filter(n => !assigned.has(n));
    const missingHtml = missing.length === 0
      ? '<span class="summary-note">전원 입력 완료</span>'
      : missing.map(n => `<span class="missing-chip">${escapeHtml(n)}</span>`).join(' ');

    return `
      <div class="status-panel">
        <div class="summary-title" style="margin-bottom:12px;">📋 현재 입력 현황</div>
        ${carRows}
        <hr class="summary-divider">
        <div class="status-panel-row">
          <div class="status-panel-slot">미이용</div>
          <div class="status-panel-names">${nuText}</div>
        </div>
        <hr class="summary-divider">
        <div class="status-panel-row">
          <div class="status-panel-slot">미입력 (${missing.length}명)</div>
          <div class="status-panel-names">${missingHtml}</div>
        </div>
      </div>
    `;
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }

  setupHomeScreenHints();
  subscribeRealtime();
})();
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(e => console.error('SW 등록 실패', e));
    });
  }
</script>
